<body>

<!-- 登录界面 -->

</div>

<div class="admin-container">

    <div class="admin-body">

            <div class="sidebar-section">

<!-- 添加/编辑歌曲模态框 -->
<div class="modal" id="songModal">

<!-- 修改密码模态框 -->
<div class="modal" id="passwordModal">

        <div class="modal-header">
            <h2>修改管理密码</h2>
            <button class="modal-close" onclick="closePasswordModal()">&times;</button>

            <div class="form-group">
                <label for="oldPassword">当前密码 *</label>

            <div class="form-group">
                <label for="newPassword">新密码 *</label>
                <input type="password" id="newPassword" placeholder="请输入新密码" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">确认新密码 *</label>
                <input type="password" id="confirmPassword" placeholder="请再次输入新密码" required>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="closePasswordModal()">取消</button>
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-check"></i> 确认修改
                </button>
            </div>
        </form>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==================== 登录验证系统 ====================

// 默认管理密码(建议首次登录后修改)
const DEFAULT_ADMIN_PASSWORD = 'admin123';

// 检查是否已登录
function checkAuth() {
    const session = localStorage.getItem('gedan_admin_session');
    if (!session) {
        showLoginForm();
        return false;
    }

    // 验证会话是否有效
    const sessionData = JSON.parse(session);
    const now = Date.now();
    if (now - sessionData.timestamp > 24 * 60 * 60 * 1000) { // 24小时过期
        localStorage.removeItem('gedan_admin_session');
        showLoginForm();
        return false;
    }

    return true;
}

// 显示登录表单
function showLoginForm() {
    document.getElementById('loginContainer').classList.add('show');
    document.querySelector('.admin-container').style.display = 'none';
}

// 隐藏登录表单
function hideLoginForm() {
    document.getElementById('loginContainer').classList.remove('show');
    document.querySelector('.admin-container').style.display = 'block';
}

// 登录验证
function login(password) {
    // 获取存储的密码,如果没有则使用默认密码
    const storedPassword = localStorage.getItem('gedan_admin_password') || DEFAULT_ADMIN_PASSWORD;

    if (password === storedPassword) {
        // 创建会话
        const session = {
            timestamp: Date.now(),
            user: 'admin'
        };
        localStorage.setItem('gedan_admin_session', JSON.stringify(session));
        hideLoginForm();
        showToast('登录成功');
        return true;
    }

    return false;
}

// 退出登录
function logout() {
    if (confirm('确定要退出登录吗?')) {
        localStorage.removeItem('gedan_admin_session');
        showLoginForm();
        showToast('已退出登录');
    }
}

// 登录表单提交
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const password = document.getElementById('adminPassword').value;

    if (login(password)) {
        document.getElementById('loginError').classList.remove('show');
        document.getElementById('adminPassword').value = '';
    } else {
        document.getElementById('loginError').classList.add('show');
    }
});

// 显示修改密码模态框
function showChangePasswordModal() {
    document.getElementById('passwordModal').classList.add('active');
}

// 关闭修改密码模态框
function closePasswordModal() {
    document.getElementById('passwordModal').classList.remove('active');
    document.getElementById('passwordForm').reset();
}

// 修改密码表单提交
document.getElementById('passwordForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const oldPassword = document.getElementById('oldPassword').value;
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    // 验证当前密码
    const storedPassword = localStorage.getItem('gedan_admin_password') || DEFAULT_ADMIN_PASSWORD;
    if (oldPassword !== storedPassword) {
        showToast('当前密码错误');
        return;
    }

    // 验证新密码
    if (newPassword.length < 6) {
        showToast('新密码至少需要6个字符');
        return;
    }

    // 验证两次输入的密码是否一致
    if (newPassword !== confirmPassword) {
        showToast('两次输入的密码不一致');
        return;
    }

    // 保存新密码
    localStorage.setItem('gedan_admin_password', newPassword);
    closePasswordModal();
    showToast('密码修改成功');
});

// 点击模态框外部关闭修改密码模态框
document.getElementById('passwordModal').addEventListener('click', function(e) {
    if (e.target === this) {
        closePasswordModal();
    }
});

// 页面加载时检查登录状态
if (!checkAuth()) {
    // 未登录,阻止后续代码执行
    throw new Error('Unauthorized access');
}

// 默认歌单数据
const DEFAULT_SONGS_TEXT = `

function parseSongs(raw) {
    const lines = raw.split(/\r?\n/);
    const songs = [];
    for (let line of lines) {
        line = line.trim();
        if (line === "") continue;
        const lastDash = line.lastIndexOf('-');
        if (lastDash === -1) continue;
        let title = line.substring(0, lastDash).trim();
        let artist = line.substring(lastDash + 1).trim();
        if (title && artist) songs.push({ id: generateId(), title, artist });
    }
    return songs;
}

function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2, 9);
}

// 初始化歌单
function initSongs() {
    let songs = localStorage.getItem('gedan_songs');
    if (!songs) {
        const defaultSongs = parseSongs(DEFAULT_SONGS_TEXT);
        localStorage.setItem('gedan_songs', JSON.stringify(defaultSongs));
        return defaultSongs;
    }
    return JSON.parse(songs);
}

// 保存歌单
function saveSongs(songs) {
    localStorage.setItem('gedan_songs', JSON.stringify(songs));
}

let allSongs = initSongs();

// 渲染表格
function renderTable(filter = '') {
    const tbody = document.getElementById('songTableBody');
    const emptyState = document.getElementById('emptyState');
    const table = document.getElementById('songTable');

    let filteredSongs = allSongs;
    if (filter) {
        const lowerFilter = filter.toLowerCase();
        filteredSongs = allSongs.filter(song =>
            song.title.toLowerCase().includes(lowerFilter) ||
            song.artist.toLowerCase().includes(lowerFilter)
        );
    }

    if (filteredSongs.length === 0) {
        table.style.display = 'none';
        emptyState.style.display = 'block';
        return;
    }

    table.style.display = 'table';
    emptyState.style.display = 'none';

    tbody.innerHTML = filteredSongs.map((song, index) => `
        <tr>
            <td>${index + 1}</td>
            <td>${escapeHtml(song.title)}</td>
            <td>${escapeHtml(song.artist)}</td>
            <td class="actions">
                <button class="btn-icon btn-edit" onclick="editSong('${song.id}')" title="编辑">
                    <i class="fas fa-edit"></i>
                </button>
                <button class="btn-icon btn-delete" onclick="deleteSong('${song.id}')" title="删除">
                    <i class="fas fa-trash"></i>
                </button>
            </td>
        </tr>
    `).join('');

    updateStats();
}

function updateStats() {
    document.getElementById('totalSongs').textContent = allSongs.length;
    const artists = new Set(allSongs.map(s => s.artist));
    document.getElementById('totalArtists').textContent = artists.size;
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

function showAddModal() {
    document.getElementById('modalTitle').textContent = '添加新歌曲';
    document.getElementById('songForm').reset();
    document.getElementById('songId').value = '';
    document.getElementById('songModal').classList.add('active');
}

function editSong(id) {
    const song = allSongs.find(s => s.id === id);
    if (!song) return;

    document.getElementById('modalTitle').textContent = '编辑歌曲';
    document.getElementById('songId').value = song.id;
    document.getElementById('songTitle').value = song.title;
    document.getElementById('songArtist').value = song.artist;
    document.getElementById('songModal').classList.add('active');
}

function closeModal() {
    document.getElementById('songModal').classList.remove('active');
}

function deleteSong(id) {
    if (!confirm('确定要删除这首歌曲吗?')) return;

    allSongs = allSongs.filter(s => s.id !== id);
    saveSongs(allSongs);
    renderTable(document.getElementById('searchInput').value);
    showToast('删除成功');
}

function filterSongs() {
    const filter = document.getElementById('searchInput').value;
    renderTable(filter);
}

function exportSongs() {
    const dataStr = JSON.stringify(allSongs, null, 2);
    const dataBlob = new Blob([dataStr], {type: 'application/json'});
    const url = URL.createObjectURL(dataBlob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `gedan_${new Date().toISOString().split('T')[0]}.json`;
    link.click();
    URL.revokeObjectURL(url);
    showToast('导出成功');
}

function importSongs(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const imported = JSON.parse(e.target.result);
            if (!Array.isArray(imported)) throw new Error('Invalid format');

            const validSongs = imported.filter(s => s.title && s.artist).map(s => ({
                id: s.id || generateId(),
                title: s.title,
                artist: s.artist
            }));

            allSongs = validSongs;

            // 按歌手名称排序
            allSongs.sort((a, b) => {
                const artistCompare = a.artist.localeCompare(b.artist, 'zh-CN');
                if (artistCompare !== 0) return artistCompare;
                return a.title.localeCompare(b.title, 'zh-CN');
            });

            saveSongs(allSongs);
            renderTable();
            showToast(`成功导入 ${validSongs.length} 首歌曲`);
        } catch (err) {
            showToast('导入失败: 文件格式错误');
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

function resetToDefault() {
    if (!confirm('确定要重置为默认歌单吗? 当前歌单将被清空!')) return;

    allSongs = parseSongs(DEFAULT_SONGS_TEXT);

    // 按歌手名称排序
    allSongs.sort((a, b) => {
        const artistCompare = a.artist.localeCompare(b.artist, 'zh-CN');
        if (artistCompare !== 0) return artistCompare;
        return a.title.localeCompare(b.title, 'zh-CN');
    });

    saveSongs(allSongs);
    renderTable();
    showToast('已重置为默认歌单');
}

function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
}

// 表单提交
document.getElementById('songForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const id = document.getElementById('songId').value;
    const title = document.getElementById('songTitle').value.trim();
    const artist = document.getElementById('songArtist').value.trim();

    if (!title || !artist) {
        showToast('请填写完整信息');
        return;
    }

    if (id) {
        // 编辑
        const index = allSongs.findIndex(s => s.id === id);
        if (index !== -1) {
            allSongs[index].title = title;
            allSongs[index].artist = artist;
        }
        showToast('修改成功');
    } else {
        // 新增
        allSongs.push({
            id: generateId(),
            title: title,
            artist: artist
        });
        showToast('添加成功');
    }

    // 按歌手名称排序
    allSongs.sort((a, b) => {
        const artistCompare = a.artist.localeCompare(b.artist, 'zh-CN');
        if (artistCompare !== 0) return artistCompare;
        return a.title.localeCompare(b.title, 'zh-CN');
    });

    saveSongs(allSongs);
    renderTable(document.getElementById('searchInput').value);
    closeModal();
});

// 点击模态框外部关闭
document.getElementById('songModal').addEventListener('click', function(e) {
    if (e.target === this) {
        closeModal();
    }
});

// 初始化渲染
renderTable();
</script>
